# DP-4 is my main monitor
# HDMI-A-5 is my other one

general {
    ignore_empty_input = true
}

background {
    color = rgb(5, 15, 24)
}

label {
    monitor = DP-4
    text = cmd[update:800] date +"%H:%M:%S"
    color = rgb(160, 220, 235)
    halign = left
    valign = center
    position = 50, 50
    font_size = 64
    font_family = JetBrains Mono
}

label {
    monitor = DP-4
    text = cmd[update:2000] date +"%A / %d %B %Y"
    color = rgb(160, 220, 235)
    halign = left
    valign = center
    position = 54, -50
    font_size = 16
    font_family = JetBrains Mono
}

label {
    monitor = DP-4
    text = cmd[update:3600000] getent passwd "$USER" | cut -d: -f5 | cut -d, -f1
    color = rgb(160, 220, 235)
    halign = right
    valign = bottom
    position = -100, 250
    font_size = 14
    font_family = JetBrains Mono
}

label {
    monitor = DP-4
    text = $FAIL <b>(##$ATTEMPTS)</b>
    color = rgb(255, 90, 90)
    halign = right
    valign = bottom
    position = -100, 300
    font_size = 14
    font_family = JetBrains Mono
}


input-field {
    monitor = DP-4
    size = 200, 50
    position = -100, 200
    halign = right
    valign = bottom

    rounding = 0
    outline_thickness = 1
    outer_color = rgb(55, 150, 180)
    inner_color = rgba(5, 15, 24, 0.9)
    font_color = rgb(200, 235, 240)
    dots_center = false

    fade_on_empty = false
    placeholder_text = Enter Password
    fail_text = Invalid Password
    check_text = Checking...
    check_color = rgb(160, 220, 235)
}
